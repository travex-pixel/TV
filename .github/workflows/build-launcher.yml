# Builds the CleanYourTV launcher APK from the vendored, pinned source so nobody needs an
# Android SDK on their own computer. Same steps as upstream's CI. The APK and its SHA-256 are
# uploaded as a workflow artifact; nothing is published anywhere else.
name: Build launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "cleanyourtv/launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: cleanyourtv/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Record size and checksum
        run: |
          apk=cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk
          ls -la "$apk"
          sha256sum "$apk" | tee cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk.sha256
          test "$(stat -c %s "$apk")" -lt 450560
      - name: Commit the APK to the branch (the cloud session cannot reach artifact storage)
        run: |
          mkdir -p launcher-apk
          cp cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk launcher-apk/tvhome.apk
          (cd launcher-apk && sha256sum tvhome.apk > tvhome.apk.sha256)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-apk
          git diff --cached --quiet && echo "APK unchanged" || git commit -m "CI: launcher APK built from ${GITHUB_SHA}"
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher-apk
          path: |
            cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk
            cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk.sha256
            cleanyourtv/launcher/app/build/reports/tests/
          if-no-files-found: error
